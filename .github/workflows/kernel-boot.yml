# Sadim OS — المرحلة 2: بناء النواة + initramfs + اختبار إقلاع QEMU آلي
# مبدأ صارم: يفشل الـ Workflow إذا فشل اختبار الإقلاع — لا نجاح وهمي.
name: sadim-phase2-boot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Kernel + Initramfs + QEMU boot test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read kernel version
        id: kv
        run: |
          V="$(sed -n 's/^KERNEL_VERSION=//p' sadim/kernel/version.mk | tr -d '[:space:]')"
          test -n "$V" || { echo "::error::KERNEL_VERSION missing"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Kernel version: $V"

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: sadim/output/dl
          key: linux-${{ steps.kv.outputs.version }}-tarball

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            cpio rsync perl wget gzip xz-utils file \
            qemu-system-x86

      - name: Build kernel (tinyconfig + sadim fragment)
        run: bash sadim/kernel/build.sh

      - name: Build initramfs (BusyBox + sadim init)
        run: bash sadim/initramfs/build.sh

      - name: "Boot test in QEMU (gate: SADIM-BOOT-OK)"
        run: bash sadim/ci/boot-test.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadim-boot-${{ github.run_id }}
          path: |
            sadim/output/bzImage
            sadim/output/initramfs.cpio.gz
            sadim/output/boot-log.txt
          if-no-files-found: warn
