# Static repository checks only. The ISO build is a separate manual workflow.
name: sadim-ci

on:
  push:
    branches: [main]
    paths: ["docs/**", "README.md", ".github/workflows/**", "sadim/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-lint:
    name: Static checks and script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow YAML
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import glob
          import sys
          import yaml
          failures = 0
          for path in glob.glob(".github/workflows/*.yml"):
              try:
                  with open(path, encoding="utf-8") as stream:
                      yaml.safe_load(stream)
                  print("YAML OK:", path)
              except yaml.YAMLError as error:
                  print("YAML ERROR:", path, error)
                  failures += 1
          sys.exit(1 if failures else 0)
          PY

      - name: Check boot and service shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            first_line="$(head -n 1 "$file" || true)"
            if [[ "$first_line" == *bash* ]]; then
              bash -n "$file"
            else
              sh -n "$file"
            fi
            echo "Shell syntax OK: $file"
          done < <(find sadim -type f \( -name '*.sh' -o -path '*/etc/init.d/S*' -o -path '*/initramfs/init' \) -print0)

      - name: Ensure every init service is executable
        run: |
          missing="$(find sadim/initramfs/rootfs/etc/init.d -maxdepth 1 -type f -name 'S*' ! -perm -u+x -print)"
          if [ -n "$missing" ]; then
            echo "::error::Non-executable init services:"
            echo "$missing"
            exit 1
          fi
          test -x sadim/initramfs/rootfs/etc/rcS

      - name: Guard against known invalid Buildroot symbols and unsafe placeholders
        run: |
          ! grep -Eq '^BR2_PACKAGE_(QCA_ATH10K|UPPOWER|CHROMIUM|WINE|ZRAM|TMPFS|PROCPS|VMSTAT|MPSTAT|PS|FREE|DF|DU|IP|IFCONFIG|DROPBEAR_SERVER)=' sadim/rootfs/sadim-rootfs.config
          ! grep -q -- '--no-config' sadim/initramfs/rootfs/etc/init.d/S30-weston
          ! grep -q 'BRAVE_EXPECTED_SHA256=""' sadim/initramfs/rootfs/etc/init.d/S45-brave-install
          grep -q '^CONFIG_ZRAM=y$' sadim/kernel/fragments/qemu-minimal.config
          grep -q '^CONFIG_ZSMALLOC=y$' sadim/kernel/fragments/qemu-minimal.config
          grep -q 'SADIM-LIVE-OK' sadim/initramfs/init
          grep -Fq 'for dev in /dev/sr* /dev/sd*' sadim/initramfs/init
          grep -q 'firmware-5.bin' sadim/initramfs/build.sh

      - name: Verify key project documentation exists
        run: |
          test -f docs/adr/ADR-001-architecture.md
          test -f docs/research/hardware-discovery.md
          test -f docs/research/architecture-options.md
          test -f docs/roadmap.md
          test -f docs/known-issues.md
          test -f docs/testing-strategy.md
          test -f docs/usb-try-guide.md

      - name: No committed secrets
        run: |
          if grep -riEn "(api[_-]?key|secret|password|token)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9]{16,}" \
             --include='*.md' --include='*.yml' --include='*.sh' --include='*.py' . ; then
            echo "::error::Potential secret found in tracked files"
            exit 1
          fi
          echo "No secret-like assignments found."
