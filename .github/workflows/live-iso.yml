# Sadim OS — المرحلة ISO: بناء Live ISO (BIOS هجين) + اختبار إقلاع عبر المسار الحقيقي في QEMU
# مبدأ صارم: يفشل الـ Workflow إذا لم يصل الإقلاع عبر isolinux إلى SADIM-BOOT-OK ×3.
name: sadim-live-iso

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot-iso:
    name: Kernel + Initramfs + Rootfs + Live ISO + real boot-path test
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read kernel version
        id: kv
        run: |
          V="$(sed -n 's/^KERNEL_VERSION=//p' sadim/kernel/version.mk | tr -d '[:space:]')"
          test -n "$V" || { echo "::error::KERNEL_VERSION missing"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Kernel version: $V"

      - name: Cache kernel tarball
        uses: actions/cache@v4
        with:
          path: sadim/output/dl
          key: linux-${{ steps.kv.outputs.version }}-tarball

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: sadim/output/dl-rootfs
          key: buildroot-2025.02.19-dl

      - name: Cache Buildroot ccache
        uses: actions/cache@v4
        with:
          path: sadim/output/ccache
          key: buildroot-ccache-2025.02.19

      - name: Install build toolchain + ISO tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libelf-dev libssl-dev libncurses-dev \
            cpio rsync perl wget gzip xz-utils file \
            g++ patch unzip python3 \
            qemu-system-x86 xorriso isolinux syslinux-common

      - name: Build kernel (tinyconfig + sadim fragment v0.3)
        run: bash sadim/kernel/build.sh

      - name: Build initramfs (BusyBox + sadim rootfs + init v0.3)
        run: bash sadim/initramfs/build.sh

      - name: Build rootfs (Buildroot 2025.02.19 → rootfs.squashfs)
        run: bash sadim/rootfs/build.sh

      - name: Build live ISO v0.3 (BIOS hybrid CD/USB + live rootfs)
        run: bash sadim/iso/build-iso.sh

      - name: "ISO boot test in QEMU (real path: SeaBIOS→isolinux→init→overlay→services, gate: 4 markers ×3)"
        run: bash sadim/ci/boot-test-iso.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sadim-live-iso-${{ github.run_id }}
          path: |
            sadim/output/sadim.iso
            sadim/output/bzImage
            sadim/output/initramfs.cpio.gz
            sadim/output/rootfs.squashfs
            sadim/output/iso-boot-log.txt
          if-no-files-found: warn
