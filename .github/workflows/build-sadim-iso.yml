name: Sadim OS v0.2-daily ISO

# Build automatically after source changes; manual rebuilds remain available.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sadim-iso.yml'
      - 'sadim/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sadim-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-live-iso:
    name: Build Sadim OS v0.2-daily Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            cpio gzip xz-utils wget curl rsync file patch perl python3 \
            unzip git xorriso isolinux syslinux-common squashfs-tools

      - name: Cache source downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            sadim/output/dl
            sadim/output/dl-rootfs
            sadim/output/ccache
          key: sadim-v02-${{ runner.os }}-${{ hashFiles('sadim/kernel/version.mk', 'sadim/rootfs/sadim-rootfs.config', 'sadim/kernel/fragments/qemu-minimal.config') }}
          restore-keys: |
            sadim-v02-${{ runner.os }}-

      - name: Build Linux kernel
        run: bash sadim/kernel/build.sh

      - name: Build complete root filesystem (Buildroot)
        run: bash sadim/rootfs/build.sh

      - name: Build initramfs (including matching QCA9377 firmware)
        run: bash sadim/initramfs/build.sh

      - name: Build hybrid BIOS and USB ISO
        run: bash sadim/iso/build-iso.sh

      - name: Verify ISO structure, boot files and firmware
        run: |
          set -euo pipefail
          ISO=sadim/output/sadim.iso
          INITRD=sadim/output/initramfs.cpio.gz
          test -s "$ISO"
          test -s "$INITRD"
          file "$ISO"
          xorriso -indev "$ISO" -report_el_torito as_mkisofs
          xorriso -indev "$ISO" -find / -type f -print | tee /tmp/sadim-iso-files.txt
          grep -q '/isolinux/isolinux.bin' /tmp/sadim-iso-files.txt
          grep -q '/boot/vmlinuz-sadim' /tmp/sadim-iso-files.txt
          grep -q '/boot/initramfs-sadim.img' /tmp/sadim-iso-files.txt
          grep -q '/live/rootfs.squashfs' /tmp/sadim-iso-files.txt
          gzip -dc "$INITRD" | cpio -t 2>/dev/null | grep -q 'lib/firmware/ath10k/QCA9377/hw1.0/firmware-5.bin'
          mkdir -p /tmp/sadim-iso-check
          xorriso -osirrox on -indev "$ISO" -extract /live/rootfs.squashfs /tmp/sadim-iso-check/rootfs.squashfs
          test -s /tmp/sadim-iso-check/rootfs.squashfs
          unsquashfs -s /tmp/sadim-iso-check/rootfs.squashfs

      - name: Generate checksums and build report
        if: success()
        run: |
          cd sadim/output
          sha256sum sadim.iso > sadim.iso.sha256
          sha256sum -c sadim.iso.sha256
          {
            echo "Sadim OS v0.2-daily"
            echo "Commit: ${GITHUB_SHA}"
            echo "Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ISO bytes: $(stat -c%s sadim.iso)"
            echo "Kernel: $(file bzImage)"
            echo "Boot test: NOT RUN (direct USB trial requested; QEMU is not used)"
            echo "Hardware test: NOT PERFORMED"
            echo "Custom graphical app suite: NOT IMPLEMENTED"
          } > BUILD-REPORT.txt

      - name: Upload bootable Live ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sadim-os-v0.2-daily-iso
          path: |
            sadim/output/sadim.iso
            sadim/output/sadim.iso.sha256
            sadim/output/BUILD-REPORT.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sadim-v02-build-diagnostics
          path: |
            sadim/output/kernel-build.log
            sadim/output/buildroot-build/build.log
            sadim/output/buildroot-build/.config
          if-no-files-found: ignore
          retention-days: 7
