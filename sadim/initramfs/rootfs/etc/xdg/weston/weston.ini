# Minimal supported Weston configuration for the first Live GUI stage.
# This is Weston desktop shell, not the unfinished custom Sadim/Windows shell.
[core]
shell=desktop
idle-time=0

[shell]
panel-position=bottom
background-type=color
background-color=0xff0078d7
panel-color=0xdd202020
locking=true
num-workspaces=1

[keyboard]
keymap_rules=evdev
keymap_model=pc105
keymap_layout=us,ara
keymap_options=grp:alt_shift_toggle
