# Sadim OS — Weston Windows 10 Theme Configuration (UI/UX Design Phase)
# واجهة شبيهة بـ Windows 10 للمستخدم المبتدئ — استهلاك منخفض للموارد
# لا أدوات خارجية — التعديل اليدوي فقط عبر ملفات النظام

[core]
# وحدات Weston المطلوبة (DRM للعتاد، pixman للتصيير البرمجي منخفض الاستهلاك)
modules=drm.so

# خيارات التصميم (Windows 10 فلسفة: حواف حادة، ألوان موحدة، keine تزيينات زائدة)
#urtle: لا تأثيرات شفافية حقيقية (توفر كرت الشاشة Intel HD620)
use_pixman_shadows=false

[output]
# اسم المخرج DRM (virtio-gpu في QEMU، i915 على الجهاز الحقيقي Acer E5-576G)
name=drm
# الوضع المفضل للشاشة (1366x768 للجهاز المستهدف)
mode=preferred
# تحويل مخرج الشاشة (التدوير)
transform=normal

[shell]
# واجهة سطح المكتب المخصصة (سديم Shell مشابه Windows 10)
panel-position=bottom
# خلفية لونية مسطحة (بدون صور لتوفير الذاكرة والقرص SMR)
background-type=color
# لون خلفية Windows 10 الافتراضي (Dark Mode أساسي)
background-color=0x0078D7
# 표시 شريط المهام في الأسفل (مثل Windows 10)
panel-height=40
# إخفاء Task View و Search Box لتقليل الفوضى البصرية (نصيحة إضافية من المستخدم)
show-task-view-button=false
show-search-box=false

[input]
# مسار جهاز الإدخال الرئيسي (سيتم اكتشافه تلقائياً عبر udev/seatd)
path=/dev/input/event0
# تمكين اللمس (Synaptics/Elantech)
enable-touch=true

[keyboard]
# تخطيط لوحة المفاتيح العربي + إنجليزي (تبديل Alt+Shift مثل Windows)
keymap_rules=evdev
keymap_model=pc105
keymap_layout=ar,us
keymap_options=grp:alt_shift_toggle

# لا تأثيرات أنميشن ثقيلة (إيقاف أنميشن النوافذ للمحافظة على 60 FPS)
# animate-controls=false (مدعوم في Weston الإصدارات الأحدث)

[launcher]
# تطبيقات شريط المهام الأساسية (Windows 10 Core Apps)
# File Explorer (مستكشف الملفات)
icon=/usr/share/icons/hicolor/48x48/apps/filemanager.png
path=/usr/bin/sadim-file-explorer
# Notepad (مفكرة)
icon=/usr/share/icons/hicolor/48x48/apps/text-editor.png
path=/usr/bin/sadim-notepad
# Calculator (حاسبة)
icon=/usr/share/icons/hicolor/48x48/apps/calc.png
path=/usr/bin/sadim-calculator
# Task Manager (مدير المهام)
icon=/usr/share/icons/hicolor/48x48/apps/system-monitor.png
path=/usr/bin/sadim-task-manager

[desktop]
# لغة الواجهة الأساسية (العربية RTL + إنجليزية LTR)
locale=ar_SA.UTF-8
# نمط العرض: Windows 10 Flat (حواف حادة، keine دوائر)
theme=windows10-flat