# Sadim OS — Weston Windows 10 Desktop Shell Configuration
# واجهة سطح مكتب شبيهة بـ Windows 10 للمستخدم المبتدئ
# استهلاك منخفض للموارد — لا أدوات خارجية

[core]
modules=drm.so
use_pixman_shadows=false

[output]
name=drm
mode=preferred
transform=normal

[shell]
panel-position=bottom
background-type=color
background-color=0x0078D7
panel-height=40
show-task-view-button=false
show-search-box=false

[input]
path=/dev/input/event0
enable-touch=true

[keyboard]
keymap_rules=evdev
keymap_model=pc105
keymap_layout=ar,us
keymap_options=grp:alt_shift_toggle
animate-controls=false

[launcher]
icon=/usr/share/icons/hicolor/48x48/apps/filemanager.png
path=/usr/bin/sadim-file-explorer
icon=/usr/share/icons/hicolor/48x48/apps/text-editor.png
path=/usr/bin/sadim-notepad
icon=/usr/share/icons/hicolor/48x48/apps/calc.png
path=/usr/bin/sadim-calculator
icon=/usr/share/icons/hicolor/48x48/apps/system-monitor.png
path=/usr/bin/sadim-task-manager
icon=/usr/share/icons/hicolor/48x48/apps/preferences-system.png
path=/usr/bin/sadim-settings
icon=/usr/share/icons/hicolor/48x48/apps/utilities-terminal.png
path=/usr/bin/sadim-terminal
icon=/usr/share/icons/hicolor/48x48/apps/web-browser.png
path=/usr/bin/sadim-browser

[desktop]
locale=ar_SA.UTF-8
theme=windows10-flat
show-desktop-icons=true
desktop-icon-1=/usr/bin/sadim-file-explorer|مستكشف الملفات|/usr/share/icons/hicolor/48x48/apps/filemanager.png
desktop-icon-2=/usr/bin/sadim-notepad|المفكرة|/usr/share/icons/hicolor/48x48/apps/text-editor.png
desktop-icon-3=/usr/bin/sadim-calculator|الحاسبة|/usr/share/icons/hicolor/48x48/apps/calc.png
desktop-icon-4=/usr/bin/sadim-task-manager|مدير المهام|/usr/share/icons/hicolor/48x48/apps/system-monitor.png
desktop-icon-5=/usr/bin/sadim-settings|الإعدادات|/usr/share/icons/hicolor/48x48/apps/preferences-system.png
desktop-icon-6=/usr/bin/sadim-terminal|محطة الأوامر|/usr/share/icons/hicolor/48x48/apps/utilities-terminal.png
desktop-icon-7=/usr/bin/sadim-browser|متصفح الويب|/usr/share/icons/hicolor/48x48/apps/web-browser.png
