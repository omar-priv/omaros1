# Sadim OS — إعدادات Weston (DRM backend + pixman renderer)
# يوضع في /etc/xdg/weston/weston.ini
[core]
# وحدات مطلوبة: درم للعتاد، pixman للتصيير البرمجي
modules=drm.so

[output]
# الاسم: يتطابق مع مخرج DRM (virtio-gpu في QEMU، i915 على الجهاز الحقيقي)
name=drm
# الوضع: يفضل الوضع الأصلي للشاشة
mode=preferred

[input]
# seatd يدير أجهزة الإدخال
path=/dev/input/event0
# الأجهزة الإضافية تُكتشف تلقائياً عبر udev/seatd

[shell]
# واجهة سطح المكتب (desktop shell) — توفر شريط مهام، خلفيات، إلخ
panel-position=bottom
background-type=color
background-color=0x003366
# دعم RTL للغة العربية
# (يتطلب weston مُبنى مع pango — غير مُفعّل في simple clients، لكن shell يدعمه)

[launcher]
# تطبيقات اختبار بسيطة (weston-simple-* من BR2_PACKAGE_WESTON_SIMPLE_CLIENTS)
icon=/usr/share/icons/hicolor/48x48/apps/weston-terminal.png
path=/usr/bin/weston-terminal

[keyboard]
# تخطيط لوحة المفاتيح العربي + إنجليزي
keymap_rules=evdev
keymap_model=pc105
keymap_layout=ar,us
keymap_options=grp:alt_shift_toggle